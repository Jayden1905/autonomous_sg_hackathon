[project]
name = "atc-negotiation"
version = "0.1.0"
description = "Autonomous SG 2026, Airbus Challenge 2: ATC / Pilot / Ground agents negotiating disruption recovery"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=0.80",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
atc = "atc_negotiation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atc_negotiation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
