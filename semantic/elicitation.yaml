answers:
- question_id: q.atc.type.runway
  by: twr_sup_ord
  at: '2026-10-31T04:00:00Z'
  text: 'In a thunderstorm we go to a single arrival runway and the rate drops to roughly 60 percent. The problem
    is never the runway, it is the exit: if the first high-speed is blocked everyone rolls to the end and we lose
    a slot every third arrival.'
  action: answer
  structured:
    new_rule:
      id: operator.atc.single_runway_rate
      kind: constraint
      hard: false
      text: Under a weather event assume single-runway arrivals at about 60% of normal rate; a blocked first high-speed
        exit costs roughly one slot in three.
      subjects:
      - Runway
      params:
        rate_factor: 0.6
        slot_loss_per_blocked_exit: 1 in 3
  confirmed: true
  via: cli
- question_id: q.atc.open
  by: twr_sup_ord
  at: '2026-10-31T04:00:00Z'
  text: When the rate is cut I protect the heavies' spacing first and let mediums fill gaps. I will not take a tight
    slot behind a heavy for a medium just because the airline is late; the wake rule is the wake rule. What helps
    me is knowing early who is fuel-critical so I can sequence them before they declare.
  action: answer
  structured:
    new_rule:
      id: operator.atc.fuel_critical_first
      kind: precedence
      hard: false
      text: When the arrival rate is reduced, sequence declared fuel-critical aircraft ahead of others at equal
        legality; do not trade wake spacing for airline lateness.
      subjects:
      - ArrivalSlot
      params:
        priority: fuel_critical_first
  confirmed: true
  via: cli
- question_id: q.atc.param.sector_delay
  by: twr_sup_ord
  at: '2026-10-31T04:00:00Z'
  text: A minute of delay is not one cost. The first fifteen are free, after that every minute compounds because
    the flow restriction propagates upstream.
  action: answer
  structured:
    params:
      cost_per_min: 1.0
      free_minutes: 15
      note: delay cost accrues after 15 min, per operator
  confirmed: true
  via: cli
- question_id: q.pilot.open
  by: capt_737
  at: '2026-10-31T04:00:00Z'
  text: Final reserve is not negotiable and I decide to divert before I get there, not at it. If ATC cannot give
    me an EAT inside my holding fuel minus a ten minute buffer, I go. What I need from the ground is a gate commitment,
    not a hope.
  action: answer
  structured:
    new_rule:
      id: operator.pilot.divert_buffer
      kind: threshold
      hard: true
      text: Divert if the expected approach time is later than holding fuel minus a 10 min buffer above final reserve;
        the decision is made before reaching final reserve, never at it.
      subjects:
      - fuel_remaining_at_landing
      params:
        op: '>='
        value: 10
        unit: min
        above: final_reserve
      enforced_by: rules.pilot_rules
  confirmed: true
  via: cli
- question_id: q.pilot.param.connections
  by: capt_737
  at: '2026-10-31T04:00:00Z'
  text: Thirty-five is what the airline publishes at ORD; realistically forty if the connection is in another terminal.
    The last bank of the evening we protect hard because there is no recovery, the rest we do not hold for.
  action: answer
  structured:
    params:
      default_min_connect_min: 40
      cost_per_pax: 2.0
      last_bank_cost_per_pax: 6.0
    vocabulary:
    - term: last bank
      target_kind: concept
      target: Connection
  confirmed: true
  via: cli
- question_id: q.ground.type.gate
  by: dm_ord
  at: '2026-10-31T04:00:00Z'
  text: The board is optimistic by about ten minutes. If the inbound to that gate is still airborne, the gate is
    not free, whatever the board says. B12 and B14 are the chronic ones because of the tow path.
  action: answer
  structured:
    new_rule:
      id: operator.ground.gate_board_buffer
      kind: threshold
      hard: true
      text: Treat a gate as free only from 10 min after the board says so; a gate whose inbound is still airborne
        is not free.
      subjects:
      - Gate
      params:
        board_buffer_min: 10
      enforced_by: rules.ground_rules
  confirmed: true
  via: cli
- question_id: q.ground.param.turnaround
  by: dm_ord
  at: '2026-10-31T04:00:00Z'
  text: We plan forty on the 737 fleet at ORD, thirty-five is the floor under irregular ops and I will not sign
    off below that.
  action: answer
  structured:
    params:
      value: 40
      unit: min
      floor_min: 35
  confirmed: true
  via: cli
- question_id: q.ground.type.groundcrew
  by: dm_ord
  at: '2026-10-31T04:00:00Z'
  text: Crews will absorb ten minutes past shift without a word. Past twenty I have to call the union rep and it
    costs me the next shift's goodwill too.
  action: answer
  structured:
    params:
      grace_min: 10
      call_threshold_min: 20
  confirmed: true
  via: cli
- question_id: q.ground.open
  by: dm_ord
  at: '2026-10-31T04:00:00Z'
  text: A plan is unworkable when the aircraft arrives before its gate is clear and sits on a taxiway with engines
    running; controllers see a legal slot, I see a stranded aircraft. Also pushback congestion at 1800 means a late
    arrival into the B concourse blocks two departures.
  action: answer
  confirmed: false
  via: cli
- question_id: q.shared.concept.disruption
  by: dm_ord
  at: '2026-10-31T04:00:00Z'
  text: That's how we'd say it. We also call it IROPS or a 'bad day'.
  action: answer
  structured:
    aliases:
    - bad day
  confirmed: true
  via: cli
