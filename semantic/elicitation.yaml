# Elicitation ledger: what the documents could not say, asked of the people who do the job.
# Append-only. The last confirmed answer per question wins. Applied on SemanticModel.load().
#
# STATUS: the answers below are a WORKED EXAMPLE written by the model author to exercise the stage,
# not a transcript of real interviews. Every operator's title says so. Replace them with real
# operators' words before any claim of operator grounding is made to a judge or a user.
