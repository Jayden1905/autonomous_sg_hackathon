- id: q.ground.param.gate_overrun
  role: ground
  kind: default_param
  target_kind: rule
  target: ground.gate_overrun
  text: 'Rule ground.gate_overrun: Gate utilisation. The aircraft occupies the gate from arrival until its turnaround
    ends. Every minute that runs past the gate''s free window pushes the gate''s next flight, so it costs like a
    minute of delay. This is what makes the earliest slot not always the best one for ground. Is {''cost_per_min'':
    1.0} right for your operation? What would you use, and should it be a hard limit instead?'
  why: 'Current source: brief:c2:ground; these are typical values, not yours.'
  priority: 2
